name: Update Steam China Prices

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 02:00 (北京时间 10:00)
  workflow_dispatch:     # 允许手动触发

permissions:
  contents: write        # 允许提交并推送代码

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: true

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Compile TypeScript
      run: npx tsc

    - name: Scrape prices & update database
      run: node index.mjs

    - name: Export data to JSON
      run: node export.mjs

    - name: Build query page
      run: node build.mjs

    - name: Commit and push if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add steam.ddb data.json index.html
        git diff --cached --quiet || git commit -m "chore: update steam prices $(date -u +%Y-%m-%d)"
        git push
